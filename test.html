<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة قارئ الترجمة</title><link rel="stylesheet" href="style.css"></head><body>

<div class="row"><button id="go" class="btn primary">🔊 تشغيل القارئ</button><button id="domBtn" class="btn">📝 تجربة ترجمة DOM</button></div>

</main><script>

document.getElementById('domBtn').onclick=function(){var L=['هذا سطر ترجمة معروض في الصفحة.','This line is rendered in the DOM.','انتهت التجربة.'],i=0,d=document.getElementById('domsub');

(function n(){d.textContent=L[i++]||'';if(i<=L.length)setTimeout(n,2500);})();};
